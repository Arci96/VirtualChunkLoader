name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Kompilieren, testen und JAR bauen
        run: mvn -B -ntp verify

      - name: JAR als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: VirtualChunkLoader-jar
          path: target/VirtualChunkLoader-*.jar
          if-no-files-found: error
          retention-days: 30
